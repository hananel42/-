name: Generate EXE download scripts

on:
push:
paths:
- '**/*.exe'
- '**/*.EXE'

permissions:
contents: write

jobs:
generate-scripts:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4
with:
fetch-depth: 0

```
  - name: Generate extensionless PowerShell scripts
    shell: bash
    env:
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      BRANCH: ${{ github.ref_name }}
    run: |
      set -euo pipefail
      changed=0

      while IFS= read -r -d '' exe_file; do
        dir="$(dirname "$exe_file")"
        filename="$(basename "$exe_file")"
        base="${filename%.*}"
        output_path="$dir/$base"

        cat > "$output_path" <<'SCRIPT'

```

# Auto-generated script

$ErrorActionPreference = 'Stop'
$repoOwner = '**REPO_OWNER**'$repoName = '**REPO_NAME**'
$branch = '**BRANCH**'$relativePath = '**EXE_FILE**'
$encodedPath = ($relativePath -split '/' | ForEach-Object { [uri]::EscapeDataString($_) }) -join '/'$url = "[https://raw.githubusercontent.com/$repoOwner/$repoName/$branch/$encodedPath](https://www.google.com/search?q=https%3A%2F%2Fraw.githubusercontent.com%2F%24repoOwner%2F%24repoName%2F%24branch%2F%24encodedPath)"
$destination = Join-Path ([Environment]::GetFolderPath('Desktop')) '**FILENAME**'

Write-Host "Downloading **FILENAME**..."
Invoke-WebRequest -Uri $url -OutFile$destination
Write-Host "Downloaded to: $destination"

Unblock-File -Path $destination

Write-Host "Executing **FILENAME**..."
Start-Process -FilePath $destination -Wait
SCRIPT

