name: Generate EXE download scripts

on:
  push:
    paths:
      - '**/*.exe'
      - '**/*.EXE'

permissions:
  contents: write

jobs:
  generate-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate extensionless PowerShell scripts
        shell: bash
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          changed=0

          while IFS= read -r -d '' exe_file; do
            dir="$(dirname "$exe_file")"
            filename="$(basename "$exe_file")"
            base="${filename%.*}"
            output_path="$dir/$base"

            printf '# Auto-generated script\n' > "$output_path"
            printf '$ErrorActionPreference = '\''Stop'\''\n' >> "$output_path"
            printf '$repoOwner = '\''%s'\''\n' "$REPO_OWNER" >> "$output_path"
            printf '$repoName = '\''%s'\''\n' "$REPO_NAME" >> "$output_path"
            printf '$branch = '\''%s'\''\n' "$BRANCH" >> "$output_path"
            printf '$relativePath = '\''%s'\''\n' "$exe_file" >> "$output_path"
            printf '$encodedPath = ($relativePath -split '\''/'\'' | ForEach-Object { [uri]::EscapeDataString($_) }) -join '\''/'\''\n' >> "$output_path"
            printf '$url = "https://raw.githubusercontent.com/$repoOwner/$repoName/$branch/$encodedPath"\n' >> "$output_path"
            printf '$destination = Join-Path ([Environment]::GetFolderPath('\''Desktop'\'')) '\''%s'\''\n\n' "$filename" >> "$output_path"
            printf 'Write-Host "Downloading %s..."\n' "$filename" >> "$output_path"
            printf 'Invoke-WebRequest -Uri $url -OutFile $destination\n' >> "$output_path"
            printf 'Write-Host "Downloaded to: $destination"\n\n' >> "$output_path"
            printf 'Unblock-File -Path $destination\n\n' >> "$output_path"
            printf 'Write-Host "Executing %s..."\n' "$filename" >> "$output_path"
            printf 'Start-Process -FilePath $destination -Wait\n' >> "$output_path"

            chmod 644 "$output_path"
            changed=1
          done < <(find . -type f \( -iname '*.exe' \) -print0)

          if [[ "$changed" -eq 0 ]]; then
            echo "No .exe files found."
          fi

      - name: Commit generated scripts
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No generated script changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Generate download and execute scripts for EXE files"
          git push
