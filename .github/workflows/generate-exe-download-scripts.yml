        chmod 644 "$output_path"
        changed=1
      done < <(find . -type f \(-iname '*.exe'\) -print0)

      if [[ "$changed" -eq 0 ]]; then
        echo "No .exe files found."
      fi

  - name: Commit generated scripts
    shell: bash
    run: |
      set -euo pipefail
      if git diff --quiet; then
        echo "No generated script changes to commit."
        exit 0
      fi

      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add .
      git commit -m "Generate download and execute scripts for EXE files"
      git push

