
name: Generate EXE download scripts

on:
  push:
    paths:
      - '**.[eE][xX][eE]'

permissions:
  contents: write

jobs:
  generate-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate extensionless PowerShell scripts
        shell: bash
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          generated_files=()

          # Encode values so special characters cannot break the script.
          encode() {
            printf '%s' "$1" | base64 -w 0
          }

          owner_b64="$(encode "$REPO_OWNER")"
          repo_b64="$(encode "$REPO_NAME")"
          commit_b64="$(encode "$COMMIT_SHA")"

          while IFS= read -r -d '' exe_file; do
            clean_path="${exe_file#./}"
            dir="$(dirname "$clean_path")"
            filename="$(basename "$clean_path")"
            base="${filename%.*}"

            if [[ "$dir" == "." ]]; then
              output_path="$base"
            else
              output_path="$dir/$base"
            fi

            path_b64="$(encode "$clean_path")"
            filename_b64="$(encode "$filename")"

            cat > "$output_path" <<'POWERSHELL'
          # Auto-generated PowerShell download and execution script.
          $ErrorActionPreference = 'Stop'

          function Decode-Base64([string]$value) {
              return [System.Text.Encoding]::UTF8.GetString(
                  [System.Convert]::FromBase64String($value)
              )
          }

          $repoOwner = Decode-Base64 '__REPO_OWNER_B64__'
          $repoName = Decode-Base64 '__REPO_NAME_B64__'
          $commitSha = Decode-Base64 '__COMMIT_SHA_B64__'
          $relativePath = Decode-Base64 '__RELATIVE_PATH_B64__'
          $filename = Decode-Base64 '__FILENAME_B64__'

          $encodedPath = (
              $relativePath -split '/' |
              ForEach-Object {
                  [System.Uri]::EscapeDataString($_)
              }
          ) -join '/'

          $url = "https://raw.githubusercontent.com/$repoOwner/$repoName/$commitSha/$encodedPath"

          $desktop = [Environment]::GetFolderPath('Desktop')
          $destination = Join-Path $desktop $filename

          Write-Host "Downloading $filename..."
          Invoke-WebRequest -Uri $url -OutFile $destination

          Unblock-File -Path $destination

          Write-Host "Downloaded to: $destination"
          Write-Host "Executing $filename..."

          Start-Process -FilePath $destination -Wait
          POWERSHELL

            # Replace placeholders with Base64-only values.
            sed -i \
              -e "s|__REPO_OWNER_B64__|$owner_b64|g" \
              -e "s|__REPO_NAME_B64__|$repo_b64|g" \
              -e "s|__COMMIT_SHA_B64__|$commit_b64|g" \
              -e "s|__RELATIVE_PATH_B64__|$path_b64|g" \
              -e "s|__FILENAME_B64__|$filename_b64|g" \
              "$output_path"

            chmod 644 "$output_path"

            generated_files+=("$output_path")

            echo "Generated: $output_path"
          done < <(
            find . \
              -type f \
              -not -path './.git/*' \
              -iname '*.exe' \
              -print0
          )

          if [[ ${#generated_files[@]} -eq 0 ]]; then
            echo "No EXE files found."
            exit 0
          fi

          # Export generated paths for the commit step.
          printf '%s\0' "${generated_files[@]}" \
            > "$RUNNER_TEMP/generated-files"

      - name: Commit generated scripts
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "$RUNNER_TEMP/generated-files" ]]; then
            echo "No generated files to commit."
            exit 0
          fi

          mapfile -d '' -t generated_files \
            < "$RUNNER_TEMP/generated-files"

          if [[ ${#generated_files[@]} -eq 0 ]]; then
            echo "No generated files to commit."
            exit 0
          fi

          git add -f -- "${generated_files[@]}"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Generate EXE download scripts"
          git push
