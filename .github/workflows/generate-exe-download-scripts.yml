name: Generate EXE download scripts

on:
  push:
    paths:
      - '**.[eE][xX][eE]'

permissions:
  contents: write

jobs:
  generate-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate simple test files
        shell: bash
        run: |
          set -euo pipefail
          changed=0

          while IFS= read -r -d '' exe_file; do
            clean_path="${exe_file#./}"
            dir="$(dirname "$clean_path")"
            filename="$(basename "$clean_path")"
            base="${filename%.*}"

            if [ "$dir" = "." ]; then
              output_path="$base"
            else
              output_path="$dir/$base"
            fi

            echo "hello world" > "$output_path"
            echo "Created file at: $output_path"
            changed=1
          done < <(find . -type f -iname '*.exe' -print0)

          if [ "$changed" -eq 0 ]; then
            echo "No .exe files were found by find command."
          fi

      - name: Commit generated scripts
        shell: bash
        run: |
          set -euo pipefail

          git add -f .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Create simple test file for EXE"
          git push
